  subscription_model: >-
    Client POSTs a subscription carrying a `sink` URL and optional `sinkCredential`; Orange pushes
    CloudEvents to that sink. Declared in OpenAPI as `callbacks:` on the creating operation.
  auth: >-
    notificationsBearerAuth — an http bearer scheme whose bearerFormat is
