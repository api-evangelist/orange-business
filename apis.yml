    type: OpenAPI
  - url: https://github.com/camaraproject/NumberVerification
    type: SourceCode
  description: Silent, network-based mobile phone number verification using the SIM in the end user's device. Replaces
    SMS OTP and authenticator flows for app onboarding, login, and password reset. Implements the CAMARA Number
