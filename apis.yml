    type: Documentation
  description: >-
    Orange's IoT platform (also branded Datavenue) for connecting, managing, and ingesting data from IoT
    devices over LoRa, NB-IoT, LTE-M, and classic cellular. REST and MQTT interfaces for device, group,
    command, and data-stream management with end-to-end security and multi-tenant fleet operations.
