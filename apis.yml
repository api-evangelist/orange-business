    type: Documentation
  description: >-
    Manage Orange Business cellular IoT SIM fleets worldwide — activation, suspension, usage, location,
    diagnostics — across 200+ countries via a single REST surface. Backs the Orange Business Mobile Connect
    platform for global M2M and IoT deployments.
- aid: orange-business:orange-business-orange-money-webpay-api
  name: Orange Business Orange Money WebPay API
  tags:
  - Africa
  - Mobile Money
  - Orange Money
  - Payments
  - Telco
  humanURL: https://developer.orange.com/apis/om-webpay
  properties:
  - url: https://developer.orange.com/apis/om-webpay
    type: Documentation
  description: >-
    Accept Orange Money mobile-wallet payments on web and mobile checkouts across Mali, Cameroon, Cote
    d'Ivoire, Senegal, Madagascar, Botswana, Guinea Conakry, Guinea Bissau, Sierra Leone, DR Congo, and
    Central African Republic. End-user OTP via Orange Money USSD; supports tax, donations, school fees,
    and standard e-commerce.
