note: >-
  Two independent domains, no shared identifiers. Live Objects is a stateful multi-tenant IoT
  platform with a real entity graph; the CAMARA Network APIs are stateless query endpoints keyed on
  a phone number, with only Quality on Demand and Geofencing holding server-side state at all.
