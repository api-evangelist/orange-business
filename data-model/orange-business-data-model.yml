  id_conventions:
    style: opaque UUID
    example: 'bc865fe0-aa2c-40c8-b101-aee64ad78611 (observed on a live 401 error body)'
    prefixes: none
    note: >-
      No typed id prefixes (no `dev_`, `key_` style). Ids are bare UUIDs, so an id alone does not
      say what it identifies — an agent must track the entity type alongside the id.
- name: CAMARA Network APIs
  specs: openapi/_original/*.yml
  root_entity: Device
  note: >-
    Stateless by design. The subject is a Device identified by phoneNumber (E.164),
    networkAccessIdentifier, ipv4Address or ipv6Address; most operations take that identifier and
    return an answer without creating a resource.
  entities:
  - name: Device
    identifier: [phoneNumber, networkAccessIdentifier, ipv4Address, ipv6Address]
    note: >-
      When a 3-legged access token is used the device is already bound to the token — passing an
      identifier as well raises UNNECESSARY_IDENTIFIER (422).
  - name: QosSession
    identifier: sessionId
    stateful: true
    lifecycle: created with a duration, extendable while AVAILABLE, deletable before expiry
  - name: QosProfile
    identifier: name
    note: >-
      Constrains session duration (maxDuration) and throughput; served by a separate CAMARA contract
      not harvested into this repo.
  - name: GeofencingSubscription
    identifier: subscriptionId
    stateful: true
    lifecycle: created against a circular area, emits CloudEvents to a sink, deletable
  - name: Area
    kind: value object
    shapes: [CIRCLE, POLYGON]
    note: 'Population Density Data takes a POLYGON with Geohash-length precision; Location Verification takes a CIRCLE.'
  relationships:
  - from: Device
    to: QosSession
    kind: has_many
    via: sessionId
    note: retrieveSessionsByDevice returns every session for one device
  - from: QosSession
    to: QosProfile
    kind: belongs_to
    via: qosProfile
  - from: GeofencingSubscription
    to: Device
    kind: watches
  - from: GeofencingSubscription
    to: Area
    kind: has_one
cross_domain:
  shared_identifiers: none
  note: >-
    Nothing joins the two domains. A Live Objects device is a UUID on Orange's IoT platform; a CAMARA
    device is a phone number on Orange's mobile network. Even for an Orange M2M SIM managed in Live
    Objects there is no published field carrying the MSISDN that the CAMARA APIs would key on — so a
    fleet operator cannot ask a CAMARA network question about a Live Objects device without
    maintaining its own mapping. This is the single most consequential modelling gap in the estate.
