method: searched
source: >-
  PyPI (pypi.org/pypi/LiveObjects/json), npm registry (registry.npmjs.org), Maven Central
  (search.maven.org), and the GitHub REST API against github.com/DatavenueLiveObjects and
  github.com/Orange-OpenSource — the two GitHub organisations Orange publishes its client
  libraries from. DatavenueLiveObjects is the first-party org for the Live Objects (Datavenue)
  IoT platform at liveobjects.orange-business.com; Orange-OpenSource is the group-wide Orange
  open-source org already wired into apis.yml as GitHubOrganization.
note: >-
  Orange publishes NO client SDK for the CAMARA Network APIs on api.orange.com — the getting-started
  guides show raw curl/HTTP only. Every first-party package below wraps the Live Objects IoT platform
  or is an Orange design-system library rather than an API client. The Python SDK's last release
  (2.1.0, 2023-03-12) predates the current Live Objects REST API version (2026.7.0) by three years.
