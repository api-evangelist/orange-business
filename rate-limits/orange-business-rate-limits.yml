scope_note: >-
  These limits are enforced by the Orange API gateway at api.orange.com and therefore apply to
  every Orange Developer API behind it — the CAMARA Network APIs, SMS, Orange Money WebPay, Contact
  Everyone and the rest. Orange publishes NO rate limits for the Live Objects platform at
  liveobjects.orange-business.com; its OpenAPI declares 429 responses on 3 of 263 operations but
  documents no numeric limit.
