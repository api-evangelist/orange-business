response_headers:
  rate_limit_headers: []
  rate_limit_headers_note: >-
    Orange documents NO X-RateLimit-* / RateLimit-* / Retry-After response headers. An agent cannot
    read remaining budget from a response — the only runtime signal is the 403 (and, per the common
    errors table, 429) carrying code 53. This is the most actionable gap in Orange's runtime
    contract: the number is in the docs but not on the wire.
  correlation_header: X-OAPI-Request-Id
  correlation_note: >-
    "Every response includes X-OAPI-Request-Id header for troubleshooting." Present on all
    api.orange.com responses; include it when reporting persistent issues to support.
