  code: 53
  envelope: '{"code": 53, "message": "Too many requests", "description": "...", "infoURL": "..."}'
  note: >-
    Orange's common-errors table lists code 53 under BOTH 403 and 429. Clients must treat a 403
    with code 53 as a rate-limit signal, not an authorization failure — an unusual mapping worth
    coding for explicitly.
