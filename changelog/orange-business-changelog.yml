finding: >-
  Orange publishes NO dated API changelog or release-notes page on either estate. There is no
  /changelog, /release-notes or /whats-new on developer.orange.com or docs.developer.orange.com
  (docs.developer.orange.com/network-apis/changelog returns 404, and the docs sitemap lists 117 URLs
  with no changelog among them). Live Objects carries a real calendar version — 2026.7.0, meaning
  the July 2026 release — inside its OpenAPI info.version, but nothing maps that number to a set of
  changes. The closest thing to release communication is the Live Objects blog's News category, an
  RSS feed of platform announcements, which is what is recorded below. Version-to-change traceability
  is the gap: a consumer can see that the contract moved from one calendar version to the next but
  cannot find out what moved.
entries_source: >-
  blog announcements, not a changelog — each entry is a dated platform notice from the Live Objects
  News feed. Breaking-vs-additive classification below is read from the announcement text.
