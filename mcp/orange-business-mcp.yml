method: searched
source: https://github.com/camaraproject/MCPEnablement_PI1
ownership_note: >-
  The server lives in the camaraproject GitHub org rather than an Orange one, but its own README
  states it plainly: "This repository contains a Provider Implementation contributed by Orange in
  the context of the CAMARA MCP Enablement initiative" and "implementation code for the Orange MCP
  server contribution". It authenticates against Orange's own developer portal
  (https://developer.orange.com/apis/camara-playground) with an Orange CLIENT_ID/CLIENT_SECRET and
  calls Orange's gateway at api.orange.com, so it is first-party Orange work hosted in the standards
  body's org.
name: Orange Network API MCP Server (CAMARA MCP Enablement PI1)
description: >-
  A Model Context Protocol server exposing Orange's CAMARA Network APIs — SIM swap, device location,
  reachability, roaming, KYC match, population density and quality-on-demand — plus the Orange
  Network APIs Playground administration API, to any MCP-compatible AI assistant.
deployment:
  mode: local-stdio
  install: >-
    corepack enable && yarn install && yarn build   # then run dist/index.js over stdio
  package: https://github.com/camaraproject/MCPEnablement_PI1
  auth: oauth
  verified: searched
  note: >-
    NO hosted/remote endpoint. Orange publishes no MCP URL an agent can POST to — probes of
    https://mcp.developer.orange.com/mcp (no response), https://developer.orange.com/mcp (403),
    https://api.orange.com/mcp (404) and https://docs.developer.orange.com/mcp (404) all missed.
    The server must be cloned, built (Node >= 24, Yarn 4.13.0 via Corepack) and run locally over
    stdio by a human before any agent can see it. package.json declares the binary as
    "@zodiac/network-api-mcp" v0.0.3 but that name is NOT published to npm (registry.npmjs.org 404),
    so `npx` will not fetch it — source build is the only install path.
requires:
  runtime: Node.js >= 24.0.0
  package_manager: Yarn 4.13.0 (via Corepack)
  credentials: >-
    CLIENT_ID and CLIENT_SECRET obtained by subscribing to the CAMARA Playground API at
    https://developer.orange.com/apis/camara-playground
environment: >-
  Playground (mock) only — the tools call https://api.orange.com/camara/playground/api/... and the
  playground admin API. The same tools point at production once credentials and base URL are swapped.
tool_count: 24
