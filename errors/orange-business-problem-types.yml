# Orange Business error catalog
generated: '2026-08-26'
method: searched
source: https://developer.orange.com/common-errors and https://developer.orange.com/resources/orange-apis-error-handling/
  for the gateway catalog; openapi/_original/*.yml (CAMARA contracts) and openapi/orange-business-live-objects-openapi.json
  for the per-API catalogs.
format: vendor-json
rfc9457: false
note: Orange runs THREE different error envelopes, and a client has to handle all three. (1) The api.orange.com
  gateway returns {code:<int>, message, description, infoURL} — a numeric code, documented at developer.orange.com/common-errors.
  (2) The CAMARA Network APIs behind that gateway return the CAMARA ErrorInfo shape {status:<int>, code:<string>,
  message} with string codes such as UNAUTHENTICATED and LOCATION_RETRIEVAL.UNABLE_TO_LOCATE. (3) Live
  Objects returns {id, code:<string>, message, details} plus, on some operations, a category enum of PERMANENT/TRANSIENT/UNEXPECTED.
  None of the three is application/problem+json, so RFC 9457 does not apply. The Live Objects `category`
  field is the only machine-readable retryability signal Orange publishes anywhere.
envelopes:
- name: Orange API gateway
  applies_to: every API on api.orange.com
  shape: '{"code": 41, "message": "Invalid credentials", "description": "...", "infoURL": "..."}'
  code_type: integer
  source: https://developer.orange.com/common-errors
- name: CAMARA ErrorInfo
  applies_to: the CAMARA Network APIs (SIM Swap, Device Location, KYC Match, QoD, ...)
  shape: '{"status": 401, "code": "UNAUTHENTICATED", "message": "..."}'
  code_type: string
  source: openapi/_original/*.yml components.schemas.ErrorInfo
- name: Live Objects WebErrorResponse / ServiceErrorResponse
  applies_to: liveobjects.orange-business.com
  shape: '{"id": "<uuid>", "code": "UNAUTHORIZED", "message": "...", "details": "...", "category": "PERMANENT|TRANSIENT|UNEXPECTED"}'
  code_type: string
  source: openapi/orange-business-live-objects-openapi.json components.schemas.WebErrorResponse
gateway_problem_types:
- status: 400
  code: '20'
  title: Invalid URL parameter value
  detail: One or more URL parameters contain invalid values.
  remediation: Verify URL parameters
- status: 400
  code: '21'
  title: Missing body
  detail: Request body required
  remediation: Add required body
- status: 400
  code: '22'
  title: Invalid body
  detail: Body format incorrect
  remediation: Fix body format
- status: 400
  code: '23'
  title: Missing body field
  detail: Required field absent
  remediation: Include missing field
- status: 400
  code: '24'
  title: Invalid body field
  detail: Field value invalid
  remediation: Correct field value
- status: 400
  code: '25'
  title: Missing header
  detail: Required header absent
  remediation: Add required header
- status: 400
  code: '26'
  title: Invalid header value
  detail: Header contains invalid value
  remediation: Fix header value
- status: 400
  code: '27'
  title: Missing query-string parameter
  detail: Query parameter required
  remediation: Add parameter
- status: 400
  code: '28'
  title: Invalid query-string parameter value
  detail: One or more query-string parameters contain invalid values.
  remediation: Validate parameters
- status: 401
  code: '40'
  title: Missing credentials
  detail: 'The requested service needs credentials, but none were provided. Causes: missing Authorization
    header, missing token, missing Bearer prefix.'
  remediation: Send a valid Bearer access token
- status: 401
  code: '41'
  title: Invalid credentials
  detail: Invalid client_id and/or client_secret, or a pending or revoked client_id.
  remediation: Check app credentials in the developer portal
- status: 401
  code: '42'
  title: Expired credentials
  detail: The requested service needs credentials, and the ones provided were out-of-date (expired OAuth
    2.0 token).
  remediation: Request a new token from the token endpoint
- status: 403
  code: '50'
  title: Access denied
  detail: Not subscribed API, or a pending or revoked API subscription.
  remediation: Verify the API subscription in the portal
- status: 403
  code: '51'
  title: Forbidden requester
  detail: Requester blocked
  remediation: Contact support
- status: 403
  code: '52'
  title: Forbidden user
  detail: User blocked
  remediation: Contact support
- status: 403
  code: '53'
  title: Too many requests
  detail: The application has made too many calls and has exceeded the rate limit for this service (spike
    arrest limit or global quota limit).
  remediation: Back off and retry after at least one second
- status: 404
  code: '60'
  title: Resource not found
  detail: The requested URI or the requested resource does not exist.
  remediation: Verify the resource path
- status: 405
  code: '61'
  title: Method not allowed
  detail: HTTP method unsupported
  remediation: Use the correct HTTP method
- status: 406
  code: '62'
  title: Not acceptable
  detail: Accept header mismatch
  remediation: Check the requested content type
- status: 408
  code: '63'
  title: Request time-out
  detail: The server timed out waiting for the incoming request.
  remediation: Retry the request
- status: 409
  code: '69'
  title: Conflict
  detail: State conflict detected
  remediation: Resolve the conflict
- status: 411
  code: '64'
  title: Length required
  detail: The request did not specify a Content-Length header, which is required by the requested resource.
  remediation: Add Content-Length
- status: 412
  code: '65'
  title: Precondition failed
  detail: Conditional header failed
  remediation: Review preconditions
- status: 413
  code: '66'
  title: Request entity too large
  detail: The body of the request/response (PATCH, POST and PUT methods) is larger than the server is
    willing or able to process.
  remediation: Reduce payload size
- status: 414
  code: '67'
  title: Request-URI too long
  detail: URI exceeds limit
  remediation: Shorten the URI
- status: 415
  code: '68'
  title: Unsupported Media Type
  detail: The format of the posted body is not supported by the endpoint.
  remediation: Use a supported format
- status: 429
  code: '53'
  title: Too many requests
  detail: Rate limit exceeded
  remediation: Implement backoff
- status: 500
  code: '1'
  title: Internal error
  detail: Generic failure message, used if no more precise code can be provided.
  remediation: Retry or contact support
- status: 502
  code: '1'
  title: Bad gateway
  detail: A runtime execution error occurs (RaiseFault).
  remediation: Retry the request
- status: 503
  code: '5'
  title: Service temporarily unavailable
  detail: Service down or undergoing maintenance
  remediation: Retry later
- status: 503
  code: '6'
  title: Orange API is over capacity, retry later!
  detail: The service faces too much requests and can not handle the call.
  remediation: Implement exponential backoff
- status: 504
  code: '6'
  title: Gateway timeout
  detail: No response was received in time from a backend server acting as gateway or proxy.
  remediation: Retry the request
